[package]
name = "reflex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Duplica y controla la pantalla de tu móvil Android (y próximamente iPhone) en el PC. Libre y sin límite de tiempo."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["mirror", "android", "screen", "scrcpy", "airplay"]
categories = ["multimedia::video", "gui"]

# El ejecutable se llama ReflexMirror para no confundirse con otros programas llamados Reflex
# (Discord, por ejemplo, lo detectaba como el juego «Reflex Arena»).
[[bin]]
name = "ReflexMirror"
path = "src/main.rs"

[dependencies]
anyhow = "1"
sys-locale = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dirs = "6"
eframe = { version = "0.37", features = ["glow"] }
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mp4 = "0.14"
openh264 = "0.9"
sha2 = "0.10"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
# Receptor de «Enviar pantalla» (Miracast) y su vídeo por Direct3D.
windows = { version = "0.62", features = [
  "ApplicationModel_Core", "Foundation", "Media_Core", "Media_Miracast", "Media_Playback",
  "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_Com",
] }
windows-future = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# El decodificador H.264 debe ir optimizado incluso en debug, si no va a tirones.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
ico = "0.6"
resvg = "0.50"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
