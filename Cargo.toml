[package]
name = "reflex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Duplica y controla la pantalla de tu móvil Android (y próximamente iPhone) en el PC. Libre y sin límite de tiempo."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["mirror", "android", "screen", "scrcpy", "airplay"]
categories = ["multimedia::video", "gui"]

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dirs = "6"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
mp4 = "0.14"
openh264 = "0.9"
sha2 = "0.10"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# El decodificador H.264 debe ir optimizado incluso en debug, si no va a tirones.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
ico = "0.6"
resvg = "0.50"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
